version: 0.1
component: build
timeoutInSeconds: 600
shell: bash

steps:
  - type: Command
    name: "Build Stage"
    command: |
      echo "Building project..."
      mkdir -p output
      echo "<h1>Hello OCI</h1>" > output/index.html
      # Zip the directory so it can be exported as a single binary
      zip -r website_root.zip output/

  - type: Command
    name: "Test Stage"
    command: |
      echo "Running tests..."

  - type: Command
    name: "Deploy Stage"
    command: |
      echo "Deploy step executed"

outputArtifacts:
  - name: website
    type: BINARY
    # Point to the specific file created in the Build Stage
    location: website_root.zip
